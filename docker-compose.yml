# Backend versions for this tutorial are declared once here.
# Override at build time, e.g. SYNC_GATEWAY_VERSION=4.0.4-enterprise docker compose build
services:

  couchbase-server-ios-userprofile:
    build:
      context: ./src/couchbase-server
      args:
        COUCHBASE_SERVER_VERSION: ${COUCHBASE_SERVER_VERSION:-7.6.9}
    ports:
     - 8091-8097:8091-8097
     - 9123:9123
     - 11207:11207
     - 11210:11210
     - 11280:11280
     - 18091-18097:18091-18097
    environment:  
      - CLUSTER_NAME=couchbase-demo
      - COUCHBASE_ADMINISTRATOR_USERNAME=Administrator
      - COUCHBASE_ADMINISTRATOR_PASSWORD=P@ssw0rd12
      - COUCHBASE_BUCKET=userprofile
      - COUCHBASE_BUCKET_RAMSIZE=512
      - COUCHBASE_RBAC_USERNAME=admin
      - COUCHBASE_RBAC_PASSWORD=P@ssw0rd
      - COUCHBASE_RBAC_NAME=admin
      - COUCHBASE_RAM_SIZE=2048
      - COUCHBASE_INDEX_RAM_SIZE=512
    hostname: couchbase-server
    container_name: couchbase-server-ios-userprofile
    working_dir: /opt/couchbase
    stdin_open: true
    tty: true      
    networks:
      - workshop
    entrypoint: [""]
    command: sh -c "/opt/couchbase/init/init-cbserver.sh"
    healthcheck:
      # healthy once init-cbserver.sh has finished setup and the bucket is reachable
      test: ["CMD-SHELL", "test -f /opt/couchbase/init/setupComplete.txt && /opt/couchbase/bin/curl -sf -u \"$$COUCHBASE_ADMINISTRATOR_USERNAME:$$COUCHBASE_ADMINISTRATOR_PASSWORD\" http://127.0.0.1:8091/pools/default/buckets/$$COUCHBASE_BUCKET"]
      interval: 5s
      timeout: 5s
      retries: 60

  sync-gateway-ios-userprofile:
    build:
      context: ./src/sync-gateway
      args:
        SYNC_GATEWAY_VERSION: ${SYNC_GATEWAY_VERSION:-3.2.6-enterprise}
    ports:
      - 4984-4986:4984-4986
    hostname: sync-gateway
    container_name: sync-gateway-ios-userprofile
    depends_on:
      couchbase-server-ios-userprofile:
        condition: service_healthy
    working_dir: /docker-syncgateway
    stdin_open: true
    tty: true      
    networks:
      - workshop
    entrypoint: [""]
    command: sh -c "/opt/couchbase-sync-gateway/init/init-syncgateway.sh"

networks:
  workshop:
    driver: bridge
